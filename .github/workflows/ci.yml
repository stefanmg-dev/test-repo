name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, PostgreSQL, Alembic, Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: document_processing
          POSTGRES_USER: document_processing_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U document_processing_app -d document_processing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://document_processing_app:ci-password@127.0.0.1:5432/document_processing
      PIPENV_VENV_IN_PROJECT: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"


      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install locked dependencies
        run: pipenv sync --dev

      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdftoppm -v

      - name: Install CPU-only PyTorch
        run: |
          pipenv run python -m pip install             --force-reinstall             torch torchvision             --index-url https://download.pytorch.org/whl/cpu

      - name: Verify OCR runtime imports
        run: |
          pipenv run python - <<'PYTHON'
          import easyocr
          import fitz
          import torch

          assert torch.version.cuda is None
          print("easyocr import: OK")
          print("fitz import: OK")
          print("torch CPU build: OK")
          PYTHON

      - name: Install Chromium and system dependencies
        run: pipenv run playwright install --with-deps chromium

      - name: Apply database migrations
        run: pipenv run alembic upgrade head

      - name: Validate application startup
        run: |
          pipenv run python - <<'PYTHON'
          from database import engine
          from startup_validation import validate_database_startup

          result = validate_database_startup(engine)
          assert result.database_connected is True
          assert result.current_revisions == result.expected_revisions
          print("application startup validation: OK")
          PYTHON

      - name: Run test suite
        run: |
          mkdir -p test-results
          pipenv run python -m pytest -q             --junitxml=test-results/junit.xml

      - name: Verify Alembic schema parity
        run: pipenv run alembic check

      - name: Verify patch whitespace
        run: git diff --check

      - name: Build production container image
        run: docker build --tag document-processing-api:ci .

      - name: Verify production container runtime
        run: |
          docker run --rm --interactive \
            document-processing-api:ci \
            python - <<'PYTHON'
          import os
          import easyocr
          import fitz
          import torch

          assert os.getuid() == 10001
          assert torch.version.cuda is None
          assert os.environ["EASYOCR_DOWNLOAD_ENABLED"] == "false"
          assert easyocr.Reader is not None
          assert fitz.open is not None
          print("production container runtime: OK")
          PYTHON

      - name: Smoke test production container health
        run: |
          container_id=$(docker run --detach \
            --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env ENVIRONMENT=production \
            --env PORT=8010 \
            document-processing-api:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT

          python - <<'PYTHON'
          import json
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8010/ready",
                      timeout=2,
                  ) as response:
                      payload = json.load(response)
                      assert payload["status"] == "ready"
                      assert payload["database"] == "connected"
                      assert payload["migrations"] == "current"
                      print("production container readiness: OK")
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError(
                  "Production container did not become ready"
              )
          PYTHON

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
