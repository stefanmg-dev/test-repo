name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, PostgreSQL, Alembic, Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: document_processing
          POSTGRES_USER: document_processing_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U document_processing_app -d document_processing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://document_processing_app:ci-password@127.0.0.1:5432/document_processing
      PIPENV_VENV_IN_PROJECT: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install locked dependencies
        run: pipenv sync --dev

      - name: Install Chromium and system dependencies
        run: pipenv run playwright install --with-deps chromium

      - name: Apply database migrations
        run: pipenv run alembic upgrade head

      - name: Run test suite
        run: |
          mkdir -p test-results
          pipenv run python -m pytest -q             --junitxml=test-results/junit.xml

      - name: Verify Alembic schema parity
        run: pipenv run alembic check

      - name: Verify patch whitespace
        run: git diff --check

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
