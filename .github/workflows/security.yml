name: Supply Chain Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python and npm vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PIPENV_VENV_IN_PROJECT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependency tooling
        run: python -m pip install pipenv pip-audit==2.10.1

      - name: Export locked Python requirements
        run: |
          pipenv requirements --dev > security-requirements.txt
          test -s security-requirements.txt

      - name: Audit locked Python dependencies
        run: |
          python -m pip_audit             --requirement security-requirements.txt             --progress-spinner off

      - name: Audit locked npm dependencies
        run: npm audit --package-lock-only --audit-level=high

  dependency-review:
    name: Review pull request dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          show-patched-versions: always

  sbom:
    name: Generate SPDX SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate and upload SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: document-processing-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
