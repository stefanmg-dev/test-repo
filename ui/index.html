<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Document Types Config</title>

    <!-- Забраняваме кеширане -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 10px; }
        h2 { margin-top: 40px; }
        input, select { width: 320px; padding: 8px; margin-top: 5px; }
        button { padding: 10px 18px; margin-top: 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .field-block { margin-bottom: 20px; padding: 15px; background: white; border-radius: 6px; }
        .popup { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; }
        .popup-content { background:white; padding:20px; border-radius:6px; width:350px; }
    </style>
</head>

<body>

<h1 style="color:purple">UI VERSION TEST</h1>
<h1>Конфигурация на типове документи</h1>

<div id="content"></div>

<div class="form-section">
<h2>Добави ново поле</h2>

<form id="addFieldForm">
    <label>Тип документ:</label><br>
    <select name="document_type">
        <option value="invoice">invoice</option>
        <option value="contract">contract</option>
        <option value="other">other</option>
    </select><br><br>

    <label>Име на поле (name):</label><br>
    <input type="text" name="name"><br><br>

    <label>Label BG:</label><br>
    <input type="text" name="label_bg"><br><br>

    <label>Label EN:</label><br>
    <input type="text" name="label_en"><br><br>

    <label>Тип поле:</label><br>
    <select name="field_type" id="field_type">
        <option value="llm">LLM</option>
        <option value="regex">Regex</option>
    </select><br><br>

    <label>Regex правило (ако е regex):</label><br>
    <input type="text" name="rule" id="rule" style="display:none;"><br><br>

    <button type="button" onclick="addField()">Добави поле</button>
</form>
</div>

<!-- EDIT POPUP -->
<div id="editPopup" class="popup">
    <div class="popup-content">
        <h3>Редакция на поле</h3>

        <label>Label BG:</label>
        <input id="editLabelBg" type="text">

        <label>Label EN:</label>
        <input id="editLabelEn" type="text">

        <label>Type:</label>
        <select id="editType">
            <option value="llm">LLM</option>
            <option value="regex">Regex</option>
        </select>

        <label>Rule (ако е regex):</label>
        <input id="editRule" type="text" style="display:none;">

        <!-- ВАЖНО: type="button" спира reload -->
        <button type="button" onclick="saveEdit()" 
                style="background:#198754; color:white; padding:8px 12px; border:none; border-radius:4px; margin-top:10px;">
            Save
        </button>

        <button type="button" onclick="closeEditPopup()" 
                style="background:#6c757d; color:white; padding:8px 12px; border:none; border-radius:4px; margin-top:10px;">
            Cancel
        </button>
    </div>
</div>


<!-- Външен JS файл -->
<script src="/ui/ui.js"></script>

</body>
</html>
